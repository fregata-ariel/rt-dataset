[project]
name = "plateau-sionna-dataset"
version = "0.1.0"
description = "CityGML to Sionna-RT Ray Tracing Dataset Generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cjio>=0.9.0",         # CityJSONパーサー
    "trimesh>=4.0.0",      # 3Dメッシュ処理
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "rasterio>=1.3.0",     # DEM(GeoTIFF)処理用
    "pyyaml>=6.0",
    "click>=8.1.7",        # CLI構築用
    "sionna-rt",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "jupyter>=1.0.0",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # PEP8, Pyflakes, isort

[tool.uv.sources]
sionna-rt = { path = "/wheels/sionna_rt-2.0.1-py3-none-any.whl" }
