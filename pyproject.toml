[project]
name = "plateau-sionna-dataset"
version = "0.1.0"
description = "CityGML to Sionna-RT Ray Tracing Dataset Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cjio>=0.9.0",         # CityJSONパーサー
    "trimesh>=4.0.0",      # 3Dメッシュ処理
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "rasterio>=1.3.0",     # DEM(GeoTIFF)処理用
    "pyyaml>=6.0",
    "click>=8.1.7",        # CLI構築用
    "matplotlib>=3.10",    # RFカメラ/カバレッジの診断画像
    "sionna-rt",
]

[dependency-groups]
# test: 本番イメージにも含め、CI は本番イメージそのものでテストする
test = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
# dev: Devcontainer 用 (test + ノートブック・型チェック)
dev = [
    { include-group = "test" },
    "jupyter>=1.0.0",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # PEP8, Pyflakes, isort

[tool.uv.sources]
# サブモジュールのソースから直接ビルドする (純 Python のため CUDA アーキテクチャ非依存)
sionna-rt = { path = "third_party/sionna-rt" }
