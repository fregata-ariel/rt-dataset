# イメージは docker/Dockerfile のマルチステージから3つだけ作る:
#   base : ${IMAGE_PREFIX}-base  CUDA base + OS ライブラリ + uv + Python
#   prod : ${IMAGE_PREFIX}       本番 (uv.lock 通りの依存 + test ツール + src)。CI もこれを使う
#   dev  : ${IMAGE_PREFIX}-dev   Devcontainer 用 (prod + 開発ツール)
#
# IMAGE_PREFIX: イメージ名の接頭辞 (既定: plateau-sionna)。
#   CI は別の接頭辞を使い、開発者のイメージタグを上書きしない。
# CUDA_BASE_IMAGE: ベースにする nvidia/cuda イメージを差し替える場合に指定する。

x-build: &build
  context: .
  dockerfile: docker/Dockerfile
  args:
    CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:12.8.1-base-ubuntu24.04}

services:
  base:
    image: ${IMAGE_PREFIX:-plateau-sionna}-base:latest
    build:
      <<: *build
      target: base

  prod:
    image: ${IMAGE_PREFIX:-plateau-sionna}:latest
    build:
      <<: *build
      target: prod

  dev:
    image: ${IMAGE_PREFIX:-plateau-sionna}-dev:latest
    build:
      <<: *build
      target: dev

  # インフラ統合テスト: prod イメージ上で Sionna-RT のユニットテスト (CPU/LLVM サブセット) を実行
  test:
    image: ${IMAGE_PREFIX:-plateau-sionna}:latest
    pull_policy: never
    profiles:
      - test
    volumes:
      - ./third_party/sionna-rt/test:/test-data:ro
    working_dir: /test-data
    command: >
      python -m pytest -o cache_dir=/tmp/.pytest_cache --cpu -v
      unit/test_utils.py unit/test_hashing.py

  # CI ランナー: prod イメージにチェックアウト中のワークスペースをマウントして検証する
  ci:
    image: ${IMAGE_PREFIX:-plateau-sionna}:latest
    pull_policy: never
    profiles:
      - ci
    # ホスト側のランナーユーザーで実行し、ワークスペースに他ユーザー所有のファイルを残さない
    # (UID 1000 ならイメージの app ユーザーと一致し HOME=/home/app になる)
    user: "${CI_UID:-1000}:${CI_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      PYTHONPATH: /workspace/src
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    command: python -m pytest -p no:cacheprovider -v tests

  # GPU 付き CI ランナー (節目に回す重い E2E 検証用)
  ci-gpu:
    extends:
      service: ci
    profiles:
      - ci
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
