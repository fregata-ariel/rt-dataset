# IMAGE_PREFIX: イメージ名の接頭辞 (既定: plateau-sionna)。
#   CIでは別の接頭辞を使い、開発者/Devcontainerが参照するイメージタグを上書きしない。
services:
  # 1. 共通ベースイメージ (依存関係なし、独立ビルド可能)
  base:
    image: ${IMAGE_PREFIX:-plateau-sionna}-base:${CUDA_ARCH}
    build:
      context: .
      dockerfile: docker/Dockerfile.base
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.1.1-devel-ubuntu22.04}

  # 2. C++ バイナリビルダー (Sionna-RTのコンパイル)
  builder:
    image: ${IMAGE_PREFIX:-plateau-sionna}-builder:${CUDA_ARCH}
    depends_on:
      - base
    build:
      context: .
      dockerfile: docker/Dockerfile.builder
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-plateau-sionna}-base:${CUDA_ARCH}
        CUDA_ARCH: ${CUDA_ARCH}

  # 3. 実行用イメージ (本番用)
  runtime:
    image: ${IMAGE_PREFIX:-plateau-sionna}-runtime:${CUDA_ARCH}
    depends_on:
      - builder
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-plateau-sionna}-base:${CUDA_ARCH}
      # builderイメージから直接アーティファクトを吸い上げる (Compose V2機能)
      additional_contexts:
        - builder=docker-image://${IMAGE_PREFIX:-plateau-sionna}-builder:${CUDA_ARCH}

  # 4. インフラ検証用テストランナー (runtimeイメージを直接利用)
  test:
    image: ${IMAGE_PREFIX:-plateau-sionna}-runtime:${CUDA_ARCH}
    depends_on:
      - builder
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-plateau-sionna}-base:${CUDA_ARCH}
      additional_contexts:
        - builder=docker-image://${IMAGE_PREFIX:-plateau-sionna}-builder:${CUDA_ARCH}
    profiles:
      - test
    volumes:
      - ./third_party/sionna-rt/test:/test-data:ro
    # test_cpx_convert[tf] は runtime の TensorFlow と Dr.Jit の DLPack 連携で abort するため除外 (本プロジェクトはTF未使用)
    command: >
      bash -c "uv pip install --system 'pytest>=8.0.0' && 
      cd /test-data && 
      python -m pytest -o cache_dir=/tmp/.pytest_cache --cpu -v -k 'not (test_cpx_convert and tf)' unit/test_utils.py unit/test_hashing.py"

  # 5. CIランナー (runtime + pytest)。チェックアウト中のワークスペースをマウントして検証する
  ci:
    image: ${IMAGE_PREFIX:-plateau-sionna}-ci:${CUDA_ARCH}
    build:
      context: .
      dockerfile: docker/Dockerfile.ci
      args:
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-plateau-sionna}-runtime:${CUDA_ARCH}
    profiles:
      - ci
    # ホスト側のランナーユーザーで実行し、ワークスペースにroot所有のファイルを残さない
    user: "${CI_UID:-1000}:${CI_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace/src
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    command: python -m pytest -p no:cacheprovider -v tests

  # 6. GPU付きCIランナー (節目に回す重いE2E検証用)
  ci-gpu:
    extends:
      service: ci
    profiles:
      - ci
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
